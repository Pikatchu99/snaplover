name: Deploy preview

# Voir docs/PREVIEW.md pour le setup (Traefik + sous-domaine wildcard,
# une seule fois) et le fonctionnement complet. Un couple web+signaling par
# PR ouverte, jamais mélangé avec la prod (deploy/docker-compose.yml,
# jamais touché par ce workflow).
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "web/**"
      - "signaling/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".dockerignore"
      - ".github/workflows/deploy-preview.yml"
      - "deploy/preview/**"

# cancel-in-progress : un nouveau push sur la même PR remplace la preview en
# cours de déploiement, pas la queue derrière elle (contrairement à
# deploy-web.yml/deploy-signaling.yml, où les déploiements prod ne doivent
# jamais se annuler entre eux).
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  build-and-push:
    # Repo public : une PR venant d'un fork externe n'a de toute façon pas
    # accès aux secrets (comportement GitHub par défaut, pas contournable
    # depuis ce fichier) — ce garde-fou explicite évite un échec bruyant
    # plutôt qu'un skip propre pour toute contribution externe.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      image_web: ${{ steps.meta.outputs.image_web }}
      image_signaling: ${{ steps.meta.outputs.image_signaling }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR exige un nom d'image en minuscules — même calcul que
      # deploy-web.yml/deploy-signaling.yml.
      - name: Compute image names
        id: meta
        run: |
          echo "image_web=ghcr.io/${GITHUB_REPOSITORY,,}/web" >> "$GITHUB_OUTPUT"
          echo "image_signaling=ghcr.io/${GITHUB_REPOSITORY,,}/signaling" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # NEXT_PUBLIC_SITE_URL/NEXT_PUBLIC_SIGNALING_URL pointent vers CETTE
      # preview précise, pas vers la prod — figées dans le bundle client au
      # build, comme en prod (voir deploy-web.yml). Pas d'Umami sur les
      # previews : le trafic de test ne doit jamais polluer les vraies
      # analytics.
      - name: Build & push web (preview)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://pr-${{ github.event.pull_request.number }}.${{ secrets.PREVIEW_DOMAIN }}
            NEXT_PUBLIC_SIGNALING_URL=wss://pr-${{ github.event.pull_request.number }}-ws.${{ secrets.PREVIEW_DOMAIN }}
          tags: |
            ${{ steps.meta.outputs.image_web }}:pr-${{ github.event.pull_request.number }}
            ${{ steps.meta.outputs.image_web }}:pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push signaling (preview)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: signaling/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_signaling }}:pr-${{ github.event.pull_request.number }}
            ${{ steps.meta.outputs.image_signaling }}:pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Deploy preview via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_DEPLOY_USER }}
          key: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd ~/snaplover/preview
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export PR_NUMBER=${{ github.event.pull_request.number }}
            export WEB_IMAGE_TAG=pr-${PR_NUMBER}
            export SIGNALING_IMAGE_TAG=pr-${PR_NUMBER}
            export PREVIEW_DOMAIN=${{ secrets.PREVIEW_DOMAIN }}
            docker compose -p snaplover-pr-${PR_NUMBER} -f docker-compose.pr.yml pull
            docker compose -p snaplover-pr-${PR_NUMBER} -f docker-compose.pr.yml up -d
            docker image prune -f

      # --edit-last + --create-if-none : met à jour le même commentaire à
      # chaque nouveau push sur la PR (premier push = --create-if-none crée
      # le tout premier, sans lui --edit-last échouerait faute de commentaire
      # existant à éditer).
      - name: Comment preview URL on the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --edit-last \
            --create-if-none \
            --body "**Preview** : https://pr-${{ github.event.pull_request.number }}.${{ secrets.PREVIEW_DOMAIN }}"
