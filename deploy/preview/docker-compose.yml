# Proxy inverse pour les environnements de preview par PR — voir
# docs/PREVIEW.md pour le setup complet. Démarré UNE FOIS pendant le
# bootstrap (`docker compose -f deploy/preview/docker-compose.yml up -d`),
# reste tournant en permanence ensuite ; chaque PR ouverte ajoute/retire ses
# propres conteneurs à côté (voir docker-compose.pr.yml), sans jamais
# redémarrer Traefik lui-même.
#
# Complètement séparé de la prod (deploy/docker-compose.yml, ports 3002/8080,
# jamais touché ici) : réseau Docker dédié, aucun port publié sur l'hôte à
# part Traefik (127.0.0.1 uniquement — voir CLAUDE.md "Aucune valeur d'infra
# en dur"). cloudflared route *.hbdwall.xyz vers ce port (voir
# deploy/cloudflared/config.yml.example), jamais directement vers un
# conteneur de PR individuel.
services:
  traefik:
    image: traefik:v3.2
    container_name: snaplover-preview-traefik
    restart: unless-stopped
    # DOCKER_API_VERSION : sans ça, le client Docker interne de Traefik tente
    # de négocier une API bien plus ancienne (1.24) que ce que le daemon
    # accepte au minimum — "client version 1.24 is too old" (bug connu du
    # provider Docker de Traefik, testé en conditions réelles sur ce VPS, pas
    # juste en théorie). 1.41 est compatible avec tout daemon Docker récent.
    environment:
      DOCKER_API_VERSION: "1.41"
    command:
      - --providers.docker=true
      # Jamais exposer un conteneur par défaut : seuls ceux explicitement
      # labellisés traefik.enable=true (les previews par PR, voir
      # docker-compose.pr.yml) sont routés.
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=snaplover-preview-net
      - --entrypoints.web.address=:80
    ports:
      - "127.0.0.1:3999:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - preview-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  preview-net:
    name: snaplover-preview-net
